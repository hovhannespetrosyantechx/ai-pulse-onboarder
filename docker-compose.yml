services:
  db:
    image: postgres:latest
    container_name: aipulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aipulse
    ports:
      - "5432:5432"
    volumes:
      - aipulse_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aipulse_pgdata: